name: Build Windows portable app

# Builds NewzCrawl.exe on a real Windows runner (GitHub-hosted) and
# publishes a ready-to-run portable zip in the Releases tab.
#
# End users never need Python: PyInstaller freezes the interpreter INTO
# NewzCrawl.exe. This workflow is only the build machine.

on:
  push:
    branches: [main]
    paths:
      - "newzcrawl/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build NewzCrawl.exe
        working-directory: newzcrawl
        run: pyinstaller NewzCrawl.spec --noconfirm --clean

      - name: Assemble portable folder and zip
        shell: pwsh
        working-directory: newzcrawl
        run: |
          New-Item -ItemType Directory -Force -Path dist/NewzCrawl | Out-Null
          Copy-Item dist/NewzCrawl.exe dist/NewzCrawl/
          Copy-Item NewzCrawl.bat dist/NewzCrawl/
          Copy-Item -Recurse -Force tools dist/NewzCrawl/tools
          Compress-Archive -Path dist/NewzCrawl -DestinationPath NewzCrawl-portable-win-x64.zip -Force
          Get-Item NewzCrawl-portable-win-x64.zip | Select-Object Name, Length

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: NewzCrawl v0.1.0 (portable, Windows 11 x64)
          body: |
            Self-contained NewzCrawl portable app for Windows 11 (x64).
            NewsLeecher-style Usenet client: NNTP downloads, NZB import,
            PAR2 auto-repair, SuperSearch-style search, and automatic
            extraction of downloaded archives (including password-protected
            ones) via the bundled Unpack tool.

            ## Run it (no Python, no installs, no admin)
            1. Download **NewzCrawl-portable-win-x64.zip** below.
            2. Unzip it anywhere (e.g. your Desktop or a "NewzCrawl" folder).
            3. Double-click **NewzCrawl.exe**.

            Everything is bundled: 7-Zip, par2cmdline, and the Unpack
            password-archive extractor. Add the passwords of your encrypted
            archives to `passwords.txt` (one per line) next to the exe.

            The Python interpreter is frozen inside NewzCrawl.exe -
            you do NOT need to install Python or anything else.
          files: newzcrawl/NewzCrawl-portable-win-x64.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewzCrawl-portable-win-x64
          path: newzcrawl/NewzCrawl-portable-win-x64.zip
          retention-days: 90
